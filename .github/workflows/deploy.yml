name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push
      uses: docker/build-push-action@v3
      with:
        context: .
        file: docker/redmine/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/redmine:latest,ghcr.io/${{ github.repository }}/redmine:${{ github.ref_name }}
        
    - name: Trigger Deployment Webhook
      run: |
        # Example deployment trigger using a webhook or SSH command
        echo "Triggering deployment..."
        # curl -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" https://projects.glimfo.com/webhooks/deploy
